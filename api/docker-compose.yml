# API + túnel para una máquina DENTRO de la red de la oficina (la que alcanza la base de datos).
#   1) cp .env.example .env   y completar los valores
#   2) docker compose up -d --build            (solo la API, accesible en 127.0.0.1:8080)
#   3) docker compose --profile tunel up -d    (además publica la API por HTTPS con Cloudflare Tunnel)
# Ver DESPLIEGUE.md.

services:
  api:
    build: .
    image: buscador-api
    restart: unless-stopped
    env_file: .env
    environment:
      # El contenedor solo es alcanzable por el túnel (el puerto se publica únicamente en localhost),
      # por eso es seguro confiar en las cabeceras X-Forwarded-* que él agrega.
      Proxy__ConfiarEnCabeceras: "true"
      # Hora de Lima, igual que la oficina y el entorno de desarrollo (por defecto el contenedor usa UTC y
      # las fechas de creación/actualización que escribe la aplicación saldrían 5 horas adelantadas).
      TZ: America/Lima
      # Redis compartido para límites y caché (ver servicio "redis" abajo). La clave va en .env y debe ser
      # solo letras y números (una coma o un "=" romperían esta cadena de conexión).
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}"
    ports:
      # Puerto del lado de la máquina (API_PUERTO en .env, por defecto 8080). Solo en localhost.
      - "127.0.0.1:${API_PUERTO:-8080}:8080"
    volumes:
      # Excel del historial de descargas: sobrevive a `docker compose up -d --build`.
      # (`docker compose down -v` sí los borra.)
      - historial:/data
    depends_on:
      - redis

  # Límites de peticiones compartidos y caché de consultas. Solo es accesible dentro de la red de Docker
  # (no publica puertos). No guarda nada en disco: guarda datos sensibles y es solo caché, así que al
  # reiniciarse empieza vacío sin problema. Si se cae, la API sigue funcionando con límites en memoria.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}

  tunel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - api

volumes:
  historial:
